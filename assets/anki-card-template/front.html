<main class="card-shell card-front">
  <header class="importance importance-{{Importance}}">
    <span class="field-label">重要程度</span>
    <strong>{{Importance}}</strong>
  </header>

  <section class="question-block">
    <div class="field-label">问题</div>
    <div class="question">{{Front}}</div>
  </section>

  <section class="trigger-block">
    <div class="field-label">触发条件</div>
    <div class="field-content">{{Trigger}}</div>
  </section>
</main>
