{{FrontSide}}

<hr id="answer">

<main class="card-shell card-back">
  <section class="answer-block">
    <div class="field-label">答案</div>
    <div class="answer">{{Back}}</div>
  </section>

  <div class="detail-grid">
    <section class="detail-block extra-block">
      <div class="field-label">补充</div>
      <div class="field-content">{{Extra}}</div>
    </section>

    <section class="detail-block mistake-block">
      <div class="field-label">易错</div>
      <div class="field-content">{{Mistake}}</div>
    </section>
  </div>

  <footer class="source-block">
    <span class="field-label">来源</span>
    <span class="field-content">{{Source}}</span>
  </footer>
</main>
